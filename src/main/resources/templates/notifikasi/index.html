<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<!-- ==================== HEADER ==================== -->
		<div th:replace="fragments/header :: header"></div>

		<!-- ==================== SIDEBAR ==================== -->
		<div th:replace="fragments/sidebar  :: sidebar"></div>

		<input type="hidden" id="message" name="message" th:value="${message}">

		<!-- ==================== CONTENT ==================== -->
		<main class="app-main">
			<div class="app-content p-3 p-md-5">
				<div class="container-fluid">
					<div class="d-flex justify-content-between align-items-center mb-4 pt-2">
						<div>
							<h2 class="mb-0 text-success">
								Halaman Riwayat Notifikasi
							</h2>
							<p class="text-muted mb-0">Riwayat lengkap seluruh Notifikasi.</p>
						</div>
					</div>
					<div class="card card-outline card-success">
						<div class="card-header bg-white border-bottom">
							<h4 class="card-title mb-0 text-success fw-bold">
								<i class="bi bi-list-check me-2"></i>
								List Notifikasi
							</h4>
							<div class="card-tools">
								<button type="button" class="btn btn-tool text-muted" data-lte-toggle="card-collapse">
									<i data-lte-icon="expand" class="bi bi-plus-lg"></i>
									<i data-lte-icon="collapse" class="bi bi-dash-lg"></i>
								</button>
							</div>
						</div>
						<div class="card-body">
							<div class="table-responsive" style="overflow-x: scroll;">
								<div class="mb-5">
									<table id="notifTable" class="table table-bordered display table-hover">
										<thead>
											<tr>
												<th>#</th>
												<th class="min-width-100">Tipe</th>
												<th>Pesan</th>
												<th class="min-width-200">Tanggal</th>
												<th>Dibaca?</th>
												<th>Aksi</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="notif, iterStat : ${listNotif}">
												<td th:text="${iterStat.index + 1}"></td>
												<td th:text="${notif.tipe}"></td>
												<td th:text="${notif.pesan}"></td>
												<td th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}"></td>
												<td>
													<span th:text="${notif.dibaca}" th:classappend="${notif.dibaca == false} ? 'badge bg-danger' : 'badge bg-success'"></span>
												</td>
												<td>
													<a th:href="@{'/notifikasi/baca/' + ${notif.id}}" class="" data-bs-toggle="tooltip" data-bs-title="View Detail"><i class="bi bi-file-earmark"></i></a>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>

						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
	<script>
    $(function() {

      document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

      $(document).ready(function() {
        
        //ALERT
        var message = $("#message").val();
        console.log('message:',message);
        if (message === 'success') {
		    iziToast.success({
		       title : "OK",
		       message : "Konfirmasi Pembayaran Berhasil",
		       position : "topCenter",
		       transitionIn : "bounceInDown",
		       transitionOut : "fadeOutUp",
		     });
        } else if (message === 'error') {
			iziToast.error({
			  title : "Error",
			  message : "Gagal Menambah Data Iuran Kas, Hubungi Pengurus !",
			  position : "topCenter",
			  transitionIn : "bounceInDown",
			  transitionOut : "fadeOutUp",
			});
        }
      });
      
      //DATA TABLE
      $("#notifTable").DataTable({
        autoWidth : false,
        ordering : false,
      });
      
    });
  </script>
</body>
</html>
