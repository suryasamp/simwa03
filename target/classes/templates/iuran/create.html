<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary" th:attr="data-success=${message}">
	<div class="app-wrapper">
		<!-- ==================== HEADER ==================== -->
		<div th:replace="fragments/header :: header"></div>

		<!-- ==================== SIDEBAR ==================== -->
		<div th:replace="fragments/sidebar  :: sidebar"></div>

		<!-- ==================== CONTENT ==================== -->
		<main class="app-main">
			<div class="app-content p-3 p-md-5">
				<div class="container-fluid">
					<div class="d-flex align-items-center mb-4">
						<a href="/iuran" class="text-success me-3">
							<i class="bi bi-arrow-left-circle fs-3"></i>
						</a>
						<div>
							<h2 class="mb-0 text-success">Pembayaran Iuran Bulanan</h2>
							<p class="text-muted mb-0">Lengkapi formulir di bawah untuk memproses pembayaran iuran.</p>
						</div>
					</div>

					<div class="row justify-content-center">
						<div class="col">
							<div class="card shadow-sm border-0">
								<div class="card-header bg-success text-white">
									<h5 class="card-title mb-0">Form Pembayaran Iuran</h5>
								</div>
								<div class="card-body p-4">
									<form id="form-iuran" method="post" enctype="application/x-www-form-urlencoded">
										<input type="hidden" id="csrf" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
										<div class="mb-4 pb-3 border-bottom">
											<h4 class="mb-3 text-success">Data Warga</h4>
											<div class="row mb-3">
												<div class="col-sm-4">
													<label class="col-form-label text-muted">Nama Warga:</label>
												</div>
												<div class="col-sm-8">
													<input type="text" name="namaWarga" th:value="${wargaLogin.namaWarga}" class="form-control-plaintext fw-bold">
												</div>
											</div>
											<div class="row mb-3">
												<div class="col-sm-4">
													<label class="col-form-label text-muted">Nomor Rumah:</label>
												</div>
												<div class="col-sm-8">
													<input type="text" name="codeWarga" th:value="${wargaLogin.codeWarga}" class="form-control-plaintext fw-bold">
												</div>
											</div>
											<div class="row mb-3">
												<div class="col-sm-4">
													<label class="col-form-label text-muted">Nomor Hp:</label>
												</div>
												<div class="col-sm-8">
													<input type="text" name="nomerHp" th:value="${wargaLogin.nomerHp}" class="form-control-plaintext fw-bold">
												</div>
											</div>
										</div>

										<div class="mb-4">
											<h4 class="mb-3 text-success">Detail Pembayaran</h4>

											<div class="mb-4">
												<label class="form-label fw-bold">Pilih Bulan yang Akan Dibayar:</label>
												<div class="row g-2">
													<div class="col-4 col-sm-3 col-md-2" th:each="bulan, iterStat : ${bulanList}">
														<input type="checkbox" name="bulan[]" th:id="${'bulan-' + iterStat.index}" th:value="${bulan}" class="btn-check" autocomplete="off">
														<label class="btn btn-outline-success w-100" th:for="${'bulan-' + iterStat.index}" th:text="${bulan}"></label>
													</div>
												</div>
											</div>

											<div class="mb-4">
												<label for="tahun" class="form-label fw-bold">Tahun:</label>
												<input type="number" id="tahun" name="tahun" class="form-control" th:value="${#dates.year(#dates.createNow())}" min="2020" max="2030" required>
											</div>
										</div>

										<div class="p-3 bg-light rounded mb-4 d-flex justify-content-between align-items-center border-top border-bottom">
											<label class="form-label fs-5 mb-0 fw-bold">Total Bayar:</label>
											<input type="text" id="total" class="form-control-plaintext text-end fs-4 fw-bolder text-success mb-0" value="Rp0,00" readonly>
										</div>

										<button type="submit" id="bayar" class="btn btn-success btn-lg w-100 shadow-sm mt-3">
											<i class="bi bi-wallet2 me-2"></i>
											Bayar Sekarang
										</button>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" th:attr="data-client-key=${midtransClientKey}"></script>
	<script>
		document.getElementById("bayar").addEventListener("click", async (e)=> {
			try {
			  	e.preventDefault();
				const namaWarga = document.querySelector('input[name="namaWarga"]').value;
				const codeWarga = document.querySelector('input[name="codeWarga"]').value;
				const nomerHp = document.querySelector('input[name="nomerHp"]').value;
				const selectedBulan = Array.from(document.querySelectorAll("input[name='bulan[]']:checked")).map(el => el.value);
				const tahun = document.querySelector('input[name="tahun"]').value;
				const total = document.getElementById("total").value  .replace('Rp', '').replace(/\./g, '').replace(/,00/g, '').trim();
				const csrfToken = document.getElementById('csrf').value;
				
				console.log('===============');
				console.log('namaWarga:',namaWarga);
				console.log('codeWarga:',codeWarga);
				console.log('nomerHp:',nomerHp);
				console.log('selectedBulan:',selectedBulan);
				console.log('total:',total);
				console.log('===============');
				
				if(!selectedBulan || total === 'Rp0,00'){
			        iziToast.error({
			          title : "ERROR",
			          message : '<b>Mohon isi semua data terlebih dahulu</b>',
			          position : "topCenter",
			          transitionIn : "bounceInDown",
			          transitionOut : "fadeOutUp",
			        });
				}
				
				const response = await fetch('/iuran/payment',{
					method: 'POST',
					headers:{
					  'Content-Type' : 'application/json',
					  'X-CSRF-TOKEN': csrfToken 
					  },
					body:JSON.stringify({
					  namaWarga:namaWarga,
					  codeWarga:codeWarga,
					  nomerHp:nomerHp,
					  tahun:tahun,
					  selectedBulan:selectedBulan,
					  total:total
					})
				});
				
				if (!response.ok) {
				  throw new Error('Terjadi kesalahan saat mengirim data');
				}
				
				const result = await response.json();
				const token = result.token;
				console.log('Response dari server:', result);
				window.snap.pay(token, {
				  onSuccess: (res) => {
				    window.location.href = "/iuran/success"
				  },
				  onPending: (res) => iziToast.info({ title: 'Menunggu', message: 'Pembayaran sedang diproses.' }),
				  onError: (res) => {
				    window.location.href = "/iuran/error"
				  },
				  onClose: () => iziToast.warning({ title: 'Dibatalkan', message: 'Popup ditutup sebelum selesai.' })
				});
				
			} catch (e) {
			  console.error('Error:', e);
			}
		});
