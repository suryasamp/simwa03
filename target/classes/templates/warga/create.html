<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<!-- ==================== HEADER ==================== -->
		<div th:replace="fragments/header :: header"></div>

		<!-- ==================== SIDEBAR ==================== -->
		<div th:replace="fragments/sidebar  :: sidebar"></div>

		<!-- ==================== CONTENT ==================== -->
		<main class="app-main">
			<div class="app-content p-3 p-md-5">
				<div class="container-fluid">
					<div class="d-flex align-items-center mb-4">
						<a href="/warga" class="text-success me-3">
							<i class="bi bi-arrow-left-circle fs-3"></i>
						</a>
						<div>
							<h2 class="mb-0 text-success">Registrasi Warga Baru</h2>
							<p class="text-muted mb-0">Lengkapi formulir di bawah untuk mendaftarkan Warga baru.</p>
						</div>
					</div>

					<form id="userForm" th:action="@{/warga/store}" method="post" enctype="multipart/form-data">
						<div class="row g-4">

							<div class="col-md-4">
								<div class="card shadow-sm border-0 h-100">
									<div class="card-header border-bottom bg-success text-white">
										<h5 class="card-title mb-0">
											<i class="bi bi-camera me-2"></i>
											File Pendukung
										</h5>
									</div>
									<div class="card-body d-flex flex-column">

										<div class="text-center mb-4">
											<img src="/img/defaultPP.jpg" alt="Preview Profil" id="avatarPreview" class="rounded-circle img-thumbnail border border-2 p-1" style="width: 150px; height: 150px; object-fit: cover;" />
										</div>

										<div class="mb-3">
											<label for="avatarInput" class="form-label">Upload Foto (Max 1MB, JPG/PNG):</label>
											<input type="file" id="avatarInput" name="avatar" class="form-control" accept="image/jpeg,image/png,image/jpg" />
											<div class="invalid-feedback" id="avatarUpload-error"></div>
										</div>

										<div class="mb-3">
											<label for="uploadKK" class="form-label">Upload PDF KK (Max 2MB):</label>
											<input type="file" id="uploadKK" name="uploadKK" class="form-control" accept="application/pdf" />
											<div class="invalid-feedback" id="uploadKK-error"></div>
										</div>

									</div>
								</div>
							</div>

							<div class="col-md-8">
								<div class="card shadow-sm border-0 h-100">
									<div class="card-header bg-success text-white">
										<h5 class="card-title mb-0">
											<i class="bi bi-person-fill me-2"></i>
											Data Warga
										</h5>
									</div>
									<div class="card-body">

										<h6 class="text-success border-bottom border-2 pb-1 mb-3 fw-bold">Informasi Utama</h6>
										<div class="row">
											<div class="col-md-6 mb-3">
												<label for="namaWarga" class="form-label">
													Nama Warga/Kepala Keluarga
													<span class="text-danger">*</span>
												</label>
												<input type="text" id="namaWarga" name="namaWarga" placeholder="Nama Lengkap..." class="form-control" size="50" required>
												<div class="invalid-feedback"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label for="nomerHp" class="form-label">
													Nomor HP
													<span class="text-danger">*</span>
												</label>
												<input type="text" id="nomerHp" name="nomerHp" placeholder="08..." class="form-control" size="50" required>
												<div class="invalid-feedback"></div>
											</div>
										</div>

										<h6 class="text-success border-bottom border-2 pb-1 mb-3 mt-3 fw-bold">Alamat Rumah</h6>
										<div class="row">
											<div class="col-md-6 mb-3">
												<label for="blok" class="form-label">
													Blok
													<span class="text-danger">*</span>
												</label>
												<select id="blok" name="blok" class="form-select" required>
													<option value="">-- Pilih Blok --</option>
													<option value="K">Blok K</option>
													<option value="L">Blok L</option>
													<option value="M">Blok M</option>
													<option value="N">Blok N</option>
													<option value="O">Blok O</option>
												</select>
												<div class="invalid-feedback"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label for="nomerRumah" class="form-label">
													Nomor Rumah
													<span class="text-danger">*</span>
												</label>
												<select id="nomerRumah" name="nomerRumah" class="form-select" required>
													<option value="">-- Pilih Nomor Rumah --</option>
												</select>
												<div class="invalid-feedback"></div>
											</div>
										</div>

										<h6 class="text-success border-bottom border-2 pb-1 mb-3 mt-3 fw-bold">Akses & Jabatan</h6>
										<div class="row">
											<div class="col-md-6 mb-3">
												<label for="passwordWarga" class="form-label">
													Password
													<span class="text-danger">*</span>
												</label>
												<input type="password" id="passwordWarga" name="passwordWarga" placeholder="Minimal 6 Karakter..." class="form-control" size="50" required>
												<div class="invalid-feedback"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label for="roleWarga" class="form-label">
													Hak Akses (Role)
													<span class="text-danger">*</span>
												</label>
												<select id="roleWarga" name="roleWarga" class="form-select" required>
													<option value="">-- Pilih Hak Akses --</option>
													<option value="ADMIN">Admin</option>
													<option value="USER">User (Warga Biasa)</option>
												</select>
												<div class="invalid-feedback"></div>
											</div>
											<div class="col-md-6 mb-3">
												<label for="jabatan" class="form-label">
													Jabatan di Komplek
													<span class="text-danger">*</span>
												</label>
												<select id="jabatan" name="jabatan" class="form-select" required>
													<option value="">-- Pilih Jabatan --</option>
													<option value="rt">Ketua RT</option>
													<option value="sekertaris">Sekretaris</option>
													<option value="bendahara">Bendahara</option>
													<option value="warga">Warga Biasa</option>
												</select>
												<div class="invalid-feedback"></div>
											</div>
										</div>

									</div>
									<div class="card-footer bg-light border-top text-center p-3 d-flex flex-wrap justify-content-center gap-3">
										<button class="btn btn-success btn-lg shadow" id="submitBtn" type="submit">
											<i class="bi bi-save me-2"></i>
											Simpan Data Warga
										</button>
										<button class="btn btn-outline-secondary btn-lg" type="reset">
											<i class="bi bi-x-circle me-2"></i>
											Reset Form
										</button>
									</div>

								</div>
							</div>

						</div>
					</form>
				</div>
			</div>
		</main>

	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"></script>
	<script>
    $(function() {
      //Validasi Tipe File
      jQuery.validator.addMethod("fileType",
          function(value, element) {
            if (element.files.length > 0) {
              var fileType = element.files[0].type;
              return this.optional(element)
                  || [ "image/jpeg", "image/png", "image/jpg" ]
                      .indexOf(fileType) !== -1;
            }
            return true;
          });
      
      // Validasi Tipe File PDF
      jQuery.validator.addMethod("fileTypePdf", function(value, element) {
        if (element.files.length > 0) {
          var fileType = element.files[0].type;
          return this.optional(element) || fileType === "application/pdf";
        }
        return true;
      });
      
      //Validasi Ukuran File
      jQuery.validator.addMethod("fileSize", function(value, element) {
        if (element.files.length > 0) {
          var file = element.files[0];
          var maxSize = (file.type === "application/pdf") ? 2 * 1048576
              : 1048576; // PDF 2MB, gambar 1MB
          return this.optional(element) || file.size <= maxSize;
        }
        return true;
      });
      
      (rules = {
        namaWarga : {
          required : true
        },
        nomerHp : {
          required : true
        },
        blok : {
          required : true
        },
        nomerRumah : {
          required : true
        },
        passwordWarga : {
          required : true
        },
        roleWarga : {
          required : true
        },
        jabatan : {
          required : true
        },
        avatar : {
          fileType : true,
          fileSize : true,
        },
        uploadKK : {
          fileTypePdf : true,
          fileSize : true,
        },
      }), (messages = {
        namaWarga : {
          required : "Nama Warga wajib di isi"
        },
        nomerHp : {
          required : "Nomer Hp wajib di isi"
        },
        blok : {
          required : "Blok wajib di pilih"
        },
        nomerRumah : {
          required : "Nomer rumah wajib di pilih"
        },
        passwordWarga : {
          required : "Password wajib di isi"
        },
        roleWarga : {
          required : "Role wajib di pilih"
        },
        jabatan : {
          required : "Role wajib di pilih"
        },
        avatar : {
          fileType : "Format file harus jpg, jpeg, atau png!",
          fileSize : "Ukuran gambar maksimal 1MB!"
        },
        uploadKK : {
          fileTypePdf : "Format file harus PDF!",
          fileSize : "Ukuran file maksimal 2MB!"
        },
      }), (errorPlacement = function(error, element) {
        if (element.is(":radio")) {
          error.appendTo(element.parents(".jk"));
        } else {
          error.insertAfter(element);
        }
      });
      
      $("#userForm")
          .validate(
              {
                rules : rules,
                messages : messages,
                errorPlacement : errorPlacement,
                submitHandler : function(form) {
                  iziToast
                      .question({
                        timeout : false,
                        close : false,
                        overlay : true,
                        displayMode : "once",
                        id : "question",
                        zindex : 999,
                        title : "Konfirmasi",
                        message : '<span class="text-black">Apakah Anda yakin ingin <b class="text-black">SAVE</b> data ini?</span>',
                        position : "center",
                        buttons : [
                            [ "<button><b>YA</b></button>",
                                function(instance, toast) {
                                  instance.hide({
                                    transitionOut : "fadeOut"
                                  }, toast, "button");
                                  form.submit();
                                }, true ],
                            [ "<button>TIDAK</button>",
                                function(instance, toast) {
                                  instance.hide({
                                    transitionOut : "fadeOut"
                                  }, toast, "button");
                                } ] ]
                      });
                }
              });
    });//END FUNCTION
    
    document.addEventListener("DOMContentLoaded", function() {
      
      //GENERATE NOMER RUMAH	  
      const selectNoRumah = document.getElementById("nomerRumah");
      if (selectNoRumah) {
        for (let i = 1; i <= 50; i++) {
          const opt = document.createElement("option");
          opt.value = opt.textContent = i.toString().padStart(2, '0');
          selectNoRumah.appendChild(opt);
        }
      }
      
      //AVATAR PRIVIEW
      const avatarInput = document.getElementById("avatarInput");
      const avatarPreview = document.getElementById("avatarPreview");
      
      avatarInput.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            avatarPreview.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
    });
  </script>



</body>
</html>
