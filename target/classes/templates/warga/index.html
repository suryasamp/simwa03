<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary" th:attr="data-success=${message}">
	<div class="app-wrapper">
		<!-- ==================== HEADER ==================== -->
		<div th:replace="fragments/header :: header"></div>

		<!-- ==================== SIDEBAR ==================== -->
		<div th:replace="fragments/sidebar  :: sidebar"></div>

		<!-- ==================== CONTENT ==================== -->
		<main class="app-main">
			<div class="app-content p-3 p-md-5">
				<div class="container-fluid">

					<div class="d-flex justify-content-between align-items-center mb-4 pt-2">
						<div>
							<h2 class="mb-0 text-success">Data Warga RT003/021</h2>
							<p class="text-muted mb-0">Daftar lengkap seluruh kepala keluarga dan detail rumah.</p>
						</div>
						<div sec:authorize="hasRole('ADMIN')">
							<a class="btn btn-success btn-lg shadow-sm" href="/warga/create">
								<i class="bi bi-person-add me-2"></i>
								Tambah Warga Baru
							</a>
						</div>
					</div>

					<div class="card shadow-sm border-0">
						<div class="card-header bg-white border-bottom">
							<h4 class="card-title mb-0 text-success fw-bold">
								<i class="bi bi-list-check me-2"></i>
								Daftar Kepala Keluarga
							</h4>
							<div class="card-tools">
								<button type="button" class="btn btn-tool text-muted" data-lte-toggle="card-collapse">
									<i data-lte-icon="expand" class="bi bi-plus-lg"></i>
									<i data-lte-icon="collapse" class="bi bi-dash-lg"></i>
								</button>
							</div>
						</div>

						<div class="card-body">
							<div class="row g-4">
								<div th:each="warga : ${wargaList}" class="col-12 col-md-6 col-lg-4">
									<div class="card shadow-sm border-1 h-100 bg-light">
										<div class="card-body p-3 d-flex align-items-center">
											<div class="d-flex flex-column align-items-center me-3 pe-3 border-end">
												<!-- 												<img th:src="${warga.avatarPath != null} ? @{'/uploads/avatars/' + ${warga.avatarPath}} : @{/img/defaultPP.jpg}" th:attr="data-avatar-path=@{'/uploads/avatars/' + ${warga.avatarPath}}" class="rounded-circle mb-1 avatar-thumb" style="width: 50px; height: 50px; object-fit: cover;cursor: pointer;" alt="Avatar" data-bs-toggle="modal" data-bs-target="#avatarModalGlobal"/> -->
												<img th:src="${warga.avatarPath != null} 
												              ? @{'/uploads/avatars/' + ${warga.avatarPath}} 
												              : @{/img/defaultPP.jpg}" th:attr="data-avatar-path=${warga.avatarPath != null} 
												               ? @{'/uploads/avatars/' + ${warga.avatarPath}} 
												               : @{/img/defaultPP.jpg}" 
									               class="rounded-circle mb-1 avatar-thumb" style="width: 50px; height: 50px; object-fit: cover; cursor: pointer;" alt="Avatar" data-bs-toggle="modal" data-bs-target="#avatarModalGlobal" />
											</div>

											<div class="flex-grow-1">
												<h6 class="mb-0 fw-bold text-dark" th:text="${warga.namaWarga}">Nama Warga</h6>
												<small class="text-muted"><i class="bi bi-house-door me-1"></i> <span th:text="${warga.blok + '-' + warga.nomerRumah}">081xxxx</span></small> <br> <small class="text-muted"><i class="bi bi-telephone me-1"></i> <span th:text="${warga.nomerHp}">081xxxx</span></small>
												<div th:switch="${warga.jabatan}" class="mt-1">
													<span th:case="'rt'" class="badge bg-success">Ketua RT</span>
													<span th:case="'sekertaris'" class="badge bg-primary">Sekretaris</span>
													<span th:case="'bendahara'" class="badge bg-warning text-dark">Bendahara</span>
													<span th:case="*" class="badge bg-secondary">Warga</span>
												</div>
											</div>

											<div class="dropdown ms-2" th:if="${#authorization.expression('hasRole(''ADMIN'')') or (wargaLogin != null and wargaLogin.jabatan == 'rt')}">
												<button class="btn btn-light btn-sm rounded-circle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
													<i class="bi bi-three-dots-vertical"></i>
												</button>
												<ul class="dropdown-menu dropdown-menu-end">
													<li>
														<a th:href="@{/warga/edit/{id}(id=${warga.id})}" sec:authorize="hasRole('ADMIN')" class="dropdown-item">
															<i class="bi bi-pencil-square me-2"></i>
															Edit
														</a>
													</li>
													<li>
														<button th:if="${warga.kkPath != null}" class="dropdown-item btn-kk" data-bs-toggle="modal" data-bs-target="#kkModal" th:attr="data-kkpath=${warga.kkPath}">
															<i class="bi bi-file-earmark-pdf me-2"></i>
															Lihat KK
														</button>
													</li>
													<li>
														<hr class="dropdown-divider" sec:authorize="hasRole('ADMIN')">
													</li>
													<li>
														<a href="javascript:void(0);" th:attr="onclick='confirmDelete(' + ${warga.id} + ', \'' + ${warga.namaWarga} + '\')'" sec:authorize="hasRole('ADMIN')" class="dropdown-item text-danger">
															<i class="bi bi-trash me-2"></i>
															Hapus
														</a>
													</li>
												</ul>
											</div>
										</div>
									</div>
								</div>
								<div th:if="${wargaList.isEmpty()}" class="col-12">
									<div class="alert alert-info text-center" role="alert">
										<i class="bi bi-info-circle me-2"></i>
										Belum ada data warga yang terdaftar.
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
	<div class="modal fade" id="kkModal" tabindex="-1" aria-labelledby="kkModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="kkModalLabel">Kartu Keluarga</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<iframe id="kkFrame" width="100%" height="500px" style="border: 1px solid #ccc;" type="application/pdf"></iframe>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="avatarModalGlobal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content bg-primary-green text-center">
				<div class="modal-body">
					<img id="avatarPreview" class="img-fluid rounded" alt="Avatar Preview" />
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		document.addEventListener("DOMContentLoaded", function() {
			var body = document.body;
			var successMessage = body.getAttribute("data-success");
			if (successMessage && typeof iziToast !== 'undefined') {
				iziToast.success({
					title : "OK",
					message : successMessage,
					position : "topCenter",
					transitionIn : "bounceInDown",
					transitionOut : "fadeOutUp",
				});
				body.removeAttribute("data-success");
			}
			
			//Priview AVATAR
			const preview = document.getElementById('avatarPreview');
			document.querySelectorAll('.avatar-thumb').forEach(img => {
				img.addEventListener('click', () => {
					const src = img.getAttribute('data-avatar-path');
					preview.src = src; // <-- di sini baru gambar diisi saat diklik
				});
			});
			
			//Priview KK
			const kkModal = document.getElementById("kkModal");
			const kkFrame = document.getElementById("kkFrame");

			kkModal.addEventListener("show.bs.modal", function (event) {
				const button = event.relatedTarget; // tombol yang membuka modal
				const kkPath = button.getAttribute("data-kkpath");
				kkFrame.src = "/view/pdf/kk/" + kkPath;
			});
		});
		
		//Confirm Delete Data
		function confirmDelete(id, nama) {
                iziToast.question({
                    timeout: false,
                    close: false,
                    overlay: true,
                    displayMode: "once",
                    color:'#b20000',
                    messageColor: '#fff',
                    titleColor: '#fff',
                    icon:'bi bi-exclamation-octagon-fill',
                    iconColor: '#fff',
                    id: "question",
                    zindex: 999,
                    title: "Warning !",
                    message: "<b>Apakah Anda yakin ingin MENGHAPUS warga " + nama + "?</b>",
                    position: "center",
                    buttons: [
                        [
                            "<button style='background-color:#fff'>YES</button>",
                            function (instance, toast) {
                                instance.hide({ transitionOut: "fadeOut" }, toast, "button");
                                console.log("id:", id);
                                window.location.href = "warga/delete/" + id; // Redirect ke URL delete
                            },
                            true,
                        ],
                        [
                            "<button style='background-color:#fff'><strong>NO</strong></button>",
                            function (instance, toast) {
                                instance.hide({ transitionOut: "fadeOut" }, toast, "button");
                            },
                        ],
                    ],
                });
		}
	</script>
</body>
</html>
