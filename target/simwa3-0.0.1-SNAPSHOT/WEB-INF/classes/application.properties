spring.application.name=simwa3
spring.datasource.url=jdbc:postgresql://localhost:5432/simwa3
spring.datasource.username=simwa3user
spring.datasource.password=password123

# Optional JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Path folder upload, bisa diubah sesuai server
file.upload-dir=C:/simwa3/uploads

# Multipart file size limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
