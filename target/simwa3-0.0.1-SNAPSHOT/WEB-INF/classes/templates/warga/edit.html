<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<!-- ==================== HEADER ==================== -->
		<div th:replace="fragments/header :: header"></div>

		<!-- ==================== SIDEBAR ==================== -->
		<div th:replace="fragments/sidebar  :: sidebar"></div>

		<!-- ==================== CONTENT ==================== -->
		<main class="app-main">
			<div class="app-content">
				<div class="container-fluid">
					<div class="d-inline-flex mt-3 mb-3">
						<a href="/warga" class="text-primary-green me-3">
							<i class="bi bi-arrow-left-circle fs-4"></i>
						</a>
						<div class="">
							<h3 class="">Edit Data Warga</h3>
						</div>
					</div>
					<form id="userForm" th:action="@{/warga/update/{id}(id=${warga.id})}" th:object="${warga}" method="post" enctype="multipart/form-data">
						<div class="row g-3">
							<!-- ==================== UPLOAD FILE ==================== -->
							<div class="col-md-4">
								<div class="card card-outline card-success">
									<div class="card-header">
										<div class="card-title">Profile Picture</div>
									</div>
									<div class="card-body">
										<div class="d-flex justify-content-center">
											<img th:if="${warga.avatar_path != null}" th:src="@{'/uploads/avatars/' + ${warga.avatar_path}}" class="img-thumbnail rounded" style="width: 250px; height: 250px;" /> <img th:if="${warga.avatar_path == null}" th:src="@{/img/defaultPP.jpg}" class="img-thumbnail rounded" style="width: 250px; height: 250px;" />
										</div>
										<div class="m-3">
											<label for="avatar" class="form-label">Upload Picture :</label>
											<input type="file" id="avatar" name="avatar" class="form-control" />
											<div class="invalid-feedback" id="avatarUpload-error"></div>
										</div>
									</div>
								</div>
							</div>
							<!-- ==================== FORM WARGA ==================== -->
							<div class="col-md-8">
								<div class="card card-outline card-success">
									<div class="card-header">
										<div class="card-title">User Form</div>
									</div>
									<div class="card-body">
										<div class="row">
											<div class="col-md-6 mb-3">
												<label for="nama_warga1" class="form-label">Nama Warga/Kepala Keluarga</label>
												<input type="text" id="nama_warga" name="nama_warga" th:value="${warga.nama_warga}" placeholder="Nama Warga/Kepala Keluarga ..." class="form-control border border-1 border-black" size="50">
											</div>
											<div class="col-md-6 mb-3">
												<label for="" no_hp"" class="form-label">Nomer Hp</label>
												<input type="text" id="nomer_hp" name="nomer_hp" th:value="${warga.nomer_hp}" placeholder="Nomer HP ..." class="form-control border border-1 border-black" size="50">
											</div>
											<div class="col-md-6 mb-3">
												<label for="blok" class="form-label">Blok</label>
												<select id="blok" th:field="*{blok}" name="blok" class="form-select border border-1 border-black">
													<option value="">-- Pilih Blok --</option>
													<option value="K">K</option>
													<option value="L">L</option>
													<option value="M">M</option>
													<option value="N">N</option>
													<option value="O">O</option>
												</select>
											</div>
											<div class="col-md-6 mb-3">
												<label for="nomer_rumah" class="form-label">Nomer Rumah</label>
												<select th:field="*{nomer_rumah}" class="form-select border border-1 border-black">
													<option value="">-- Pilih Nomor Rumah --</option>
													<option th:each="i : ${#numbers.sequence(1,50)}" th:value="${i < 10 ? '0' + i : i}" th:text="${i < 10 ? '0' + i : i}"></option>
												</select>

											</div>
											<div class="col-md-6 mb-3">
												<label for="password_warga" class="form-label">Password</label>
												<input type="password" id="password_warga" name="password_warga" placeholder="Password ..." class="form-control border border-1 border-black" size="50">
											</div>
											<div class="col-md-6 mb-3">
												<label for="role_warga" class="form-label">Role</label>
												<select id="role_warga" th:field="*{role_warga}" name="role_warga" class="form-select border border-1 border-black">
													<option value="">-- Pilih Role --</option>
													<option value="admin">Admin</option>
													<option value="user">user</option>
												</select>
											</div>
											<div class="col-md-6 mb-3">
												<label for="jabatan" class="form-label">Jabatan</label>
												<select id="jabatan" th:field="*{jabatan}" name="jabatan" class="form-select border border-1 border-black">
													<option value="">-- Pilih Jabatan --</option>
													<option value="rt">RT</option>
													<option value="sekertaris">Sekertaris</option>
													<option value="bendahara">Bendahara</option>
													<option value="warga">Warga</option>
												</select>
											</div>
											<div class="col-md-6 mb-3">
												<label for="uploadKK" class="form-label">Upload PDF KK :</label>
												<input type="file" id="uploadKK" name="uploadKK" class="form-control" />
												<div class="invalid-feedback" id="uploadKK-error"></div>
												<button th:if="${warga.kk_path != null}" type="button" class="btn btn-sm btn-secondary mt-3" data-bs-toggle="modal" data-bs-target="#exampleModal">
													Lihat KK
													<i class="bi bi-eye"></i>
												</button>
											</div>
											<div class="mt-5 mb-3 d-flex justify-content-center">
												<button class="btn bg-primary-green text-gold me-3 w-50" id="submitBtn" type="submit">
													Update
													<i class="bi bi-floppy ms-2"></i>
												</button>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
								<div class="modal-dialog modal-lg">
									<div class="modal-content">
										<div class="modal-header">
											<h5 class="modal-title" id="exampleModalLabel">Kartu Keluarga</h5>
											<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
										</div>
										<div class="modal-body">
											<iframe th:src="@{'/view/pdf/kk/' + ${warga.kk_path}}" width="100%" height="500px" style="border: 1px solid #ccc;"></iframe>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</main>
	</div>

	<script th:inline="none">
		//ALERT BEFORE SUBMIT
		document.addEventListener("DOMContentLoaded", function() {
			const form = document.getElementById("userForm");

			form.addEventListener("submit", function(e) {
				e.preventDefault(); // tahan dulu submit

				iziToast.question({
					timeout : false,
					close : false,
					overlay : true,
					displayMode : 'once',
					id : 'question',
					zindex : 999,
					title : 'Konfirmasi',
					message : '<span class="text-black">Apakah Anda yakin ingin <b class="text-black">Update</b> data ini ?</span>',
					position : 'center',
					buttons : [
							[ '<button><b>YA</b></button>',
									function(instance, toast) {
										instance.hide({
											transitionOut : 'fadeOut'
										}, toast, 'button');
										form.submit();
									}, true ],
							[ '<button>TIDAK</button>',
									function(instance, toast) {
										instance.hide({
											transitionOut : 'fadeOut'
										}, toast, 'button');
									} ] ]
				});
			});
		});
	</script>
</body>
</html>
