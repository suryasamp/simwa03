<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary" th:attr="data-success=${message}">
	<div class="app-wrapper">
		<!-- ==================== HEADER ==================== -->
		<div th:replace="fragments/header :: header"></div>

		<!-- ==================== SIDEBAR ==================== -->
		<div th:replace="fragments/sidebar  :: sidebar"></div>

		<!-- ==================== CONTENT ==================== -->
		<main class="app-main">
			<div class="app-content">
				<div class="container-fluid">
					<div class="row mt-4 mb-4 g-3">
						<div class="col-sm-6">
							<h3 class="mb-0">Halaman Data Warga</h3>
						</div>
						<div class="col-sm-6">
							<a class="btn btn-sm fs-5 text-white float-sm-end bg-primary-green text-gold" href="/warga/create">
								<i class="bi bi-person-add me-2"></i>
								Data Warga
							</a>
						</div>
					</div>
					<div class="card card-outline card-success">
						<div class="card-header">
							<h3 class="card-title">Data Waraga</h3>
							<div class="card-tools">
								<button type="button" class="btn btn-tool" data-lte-toggle="card-collapse">
									<i data-lte-icon="expand" class="bi bi-plus-lg"></i>
									<i data-lte-icon="collapse" class="bi bi-dash-lg"></i>
								</button>
							</div>
						</div>
						<div class="card-body">
							<!-- /.card-header -->
							<div class="row">
								<div th:each="warga : ${wargaList}" class="col-12 col-md-6 col-lg-6 col-xl-4">
									<div class="info-box border border-5 border-gold bg-primary-green text-gold">
										<span class="info-box-icon">
											<img th:if="${warga.avatar_path != null}" th:src="@{'/uploads/avatars/' + ${warga.avatar_path}}" class="border border-3 rounded border-gold avatar-thumb" style="width: 70px; height: 70px; cursor: pointer;" th:attr="data-avatar-path=@{'/uploads/avatars/' + ${warga.avatar_path}}" data-bs-toggle="modal" data-bs-target="#avatarModalGlobal" />
											<img th:if="${warga.avatar_path == null}" th:src="@{/img/defaultPP.jpg}" class="border border-3 rounded border-gold avatar-thumb" style="width: 70px; height: 70px;"/>
										</span>
										<div class="info-box-content">
											<span class="info-box-text fw-bold" th:text="${warga.nama_warga}"></span>
											<div class="progress ">
												<div class="progress-bar bg-gold" style="width: 100%;"></div>
											</div>
											<span class="info-box-number" th:text="'Blok : ' + ${warga.code_warga}"></span>
											<span class="info-box-number" th:text="'No.Hp : ' + ${warga.nomer_hp}"></span>
											<div class="progress">
												<div class="progress-bar bg-gold" style="width: 100%;"></div>
											</div>
											<div class="d-flex justify-content-between">
												<div class="">
													<span th:if="${warga.jabatan == 'rt'}" class="badge text-black bg-gold">RT</span>
													<span th:if="${warga.jabatan == 'sekertaris'}" class="badge text-black bg-info">Sekertaris</span>
													<span th:if="${warga.jabatan == 'bendahara'}" class="badge text-black bg-warning">Bendahara</span>
													<span th:if="${warga.jabatan == 'warga'}" class="badge text-black bg-secondary">Warga</span>
												</div>
												<div class="">
													<a th:href="@{/warga/edit/{id}(id=${warga.id})}" class="text-gold pe-2">
														<i class="bi bi-pencil-square"></i>
													</a>
													<a href="javascript:void(0);" th:attr="onclick='confirmDelete(' + ${warga.id} + ', \'' + ${warga.nama_warga} + '\')'" class="text-gold pe-2">
														<i class="bi bi-trash"></i>
													</a>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<!-- /.card-body -->
					</div>
				</div>
			</div>
		</main>
	</div>
	<div class="modal fade" id="avatarModalGlobal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content bg-primary-green text-center">
				<div class="modal-body">
					<img id="avatarPreview" class="img-fluid rounded" alt="Avatar Preview" />
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		document.addEventListener("DOMContentLoaded", function() {
			var body = document.body;
			var successMessage = body.getAttribute("data-success");
			if (successMessage && typeof iziToast !== 'undefined') {
				iziToast.success({
					title : "OK",
					message : successMessage,
					position : "topCenter",
					transitionIn : "bounceInDown",
					transitionOut : "fadeOutUp",
				});
				body.removeAttribute("data-success");
			}
		});
		
		document.addEventListener('DOMContentLoaded', function() {
			const preview = document.getElementById('avatarPreview');
			document.querySelectorAll('.avatar-thumb').forEach(img => {
				img.addEventListener('click', () => {
					const src = img.getAttribute('data-avatar-path');
					preview.src = src; // <-- di sini baru gambar diisi saat diklik
				});
			});
		});
		
		//Confirm Delete Data
		function confirmDelete(id, nama) {
                iziToast.question({
                    timeout: false,
                    close: false,
                    overlay: true,
                    displayMode: "once",
                    color:'#FF5757',
                    messageColor: '#fff',
                    titleColor: '#fff',
                    icon:'bi bi-exclamation-octagon-fill',
                    iconColor: '#fff',
                    id: "question",
                    zindex: 999,
                    title: "Warning !",
                    message: "<b>Apakah Anda yakin ingin MENGHAPUS warga " + nama + "?</b>",
                    position: "center",
                    buttons: [
                        [
                            "<button style='background-color:#fff'>YES</button>",
                            function (instance, toast) {
                                instance.hide({ transitionOut: "fadeOut" }, toast, "button");
                                console.log("id:", id);
                                window.location.href = "warga/delete/" + id; // Redirect ke URL delete
                            },
                            true,
                        ],
                        [
                            "<button style='background-color:#fff'><strong>NO</strong></button>",
                            function (instance, toast) {
                                instance.hide({ transitionOut: "fadeOut" }, toast, "button");
                            },
                        ],
                    ],
                });
		}
	</script>
</body>
</html>
